<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Türkçe">
<link rel="manifest" href="manifest.json">
<title>Türkçe Antrenörü</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root{
  --bg:#12121a; --card:#1c1c27; --card2:#242433; --line:#31314a;
  --txt:#f0f0f7; --dim:#9a9ab5; --accent:#7c5cff; --accent2:#a78bfa;
  --ok:#34d399; --bad:#fb7185; --gold:#fbbf24;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;}
body{min-height:100vh;}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(20px + var(--safe));}
h1,h2,h3{margin:0}
button{font-family:inherit;font-size:16px;border:none;cursor:pointer;color:inherit}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--accent);
  color:#fff;font-weight:700;font-size:17px;transition:transform .1s, filter .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--txt)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--dim);font-weight:600}
.row{display:flex;gap:10px}
.muted{color:var(--dim)}
.center{text-align:center}

/* ---------- HOME ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.3px}
.iconbtn{background:var(--card);border-radius:12px;width:40px;height:40px;font-size:18px;
  display:flex;align-items:center;justify-content:center}
.hero{background:linear-gradient(150deg,#2a1f52,#1c1c27);border-radius:24px;padding:22px;text-align:center;
  border:1px solid var(--line);margin-bottom:14px}
.ring{width:150px;height:150px;margin:4px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:34px;font-weight:800;line-height:1}
.ring .sub{font-size:12px;color:var(--dim);margin-top:4px}
.streak{display:inline-flex;align-items:center;gap:6px;background:#2b2340;border:1px solid #453a63;
  padding:7px 14px;border-radius:99px;font-weight:700;font-size:14px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11px;color:var(--dim);display:block;margin-top:3px;line-height:1.3}
.hint{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  font-size:13.5px;color:var(--dim);line-height:1.55;margin-top:14px}

/* ---------- SESSION ---------- */
.pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;transition:width .35s}
.sesstop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sesstop .x{font-size:22px;color:var(--dim);background:none;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin-bottom:14px}
.qlabel{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2);
  font-weight:800;margin-bottom:14px;text-align:center}
.word{font-size:36px;font-weight:800;text-align:center;letter-spacing:-.5px;line-height:1.15}
.word.sm{font-size:28px}
.tr{font-size:22px;font-weight:700;text-align:center;color:var(--gold)}
.sent{font-size:21px;line-height:1.65;text-align:center;font-weight:500}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);
  margin:0 4px;vertical-align:-2px}
.blank.filled{border-bottom-color:var(--ok);color:var(--ok);font-weight:800}
.sentTr{font-size:14px;color:var(--dim);text-align:center;margin-top:12px;font-style:italic}
.spk{display:block;margin:14px auto 0;background:var(--card2);border-radius:99px;
  padding:9px 20px;font-size:15px;font-weight:600;color:var(--accent2);width:auto}
.opts{display:grid;gap:10px}
.opt{padding:16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  text-align:left;font-size:17px;font-weight:600;transition:.15s}
.opt:active{transform:scale(.98)}
.opt.ok{background:rgba(52,211,153,.16);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:rgba(251,113,133,.16);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.4}
input.ans{width:100%;padding:17px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  color:var(--txt);font-size:20px;font-weight:600;text-align:center;outline:none}
input.ans:focus{border-color:var(--accent)}
.feed{border-radius:18px;padding:16px;margin-top:14px;text-align:center;font-weight:600;font-size:15.5px;line-height:1.5}
.feed.ok{background:rgba(52,211,153,.13);color:var(--ok)}
.feed.bad{background:rgba(251,113,133,.13);color:var(--bad)}
.feed b{font-size:19px;display:block;margin-top:4px;color:var(--txt)}
.newtag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
  padding:4px 10px;border-radius:99px;letter-spacing:.6px;margin-bottom:12px}

/* ---------- LIST / SETTINGS ---------- */
.witem{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.witem .w{font-weight:700;font-size:16px}
.witem .t{font-size:13px;color:var(--dim);margin-top:2px}
.dots{display:flex;gap:3px;margin-left:auto;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:99px;background:var(--line)}
.dot.on{background:var(--ok)}
textarea{width:100%;min-height:130px;padding:14px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);color:var(--txt);font-size:14px;font-family:ui-monospace,Menlo,monospace;
  outline:none;resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--accent)}
.sec-title{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--accent2);margin:22px 0 10px}
.note{font-size:13px;color:var(--dim);line-height:1.6;margin:8px 0 12px}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:12.5px}

.synctoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe));
  background:var(--accent);color:#fff;font-weight:650;font-size:14.5px;padding:13px 20px;
  border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:200;max-width:92%;
  text-align:center;animation:pop .35s}
.noteitem{background:var(--card);border:1px solid var(--accent);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.noteitem b{color:var(--accent2);display:block;margin-bottom:6px;font-size:12px;
  letter-spacing:.8px;text-transform:uppercase}

.taskcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;
  margin-bottom:10px;cursor:pointer;transition:.15s}
.taskcard:active{transform:scale(.99)}
.taskcard.ok{border-color:var(--ok)} .taskcard.mid{border-color:var(--gold)}
.taskcard .tt{font-weight:800;font-size:16.5px}
.taskcard .ts{font-size:12.5px;color:var(--dim);margin-top:3px}
.taskcard .tstatus{font-size:12.5px;font-weight:700;margin-top:8px;color:var(--dim)}
.taskcard .tstatus.ok{color:var(--ok)} .taskcard .tstatus.mid{color:var(--gold)}
.passage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  font-size:15.5px;line-height:1.75;white-space:pre-wrap;margin-bottom:14px}
.qblock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.qblock.wrong{border-color:var(--bad)}
.qh{font-weight:700;font-size:15px;margin-bottom:10px;line-height:1.5}
.mk{font-weight:900;margin-left:4px}
.mk.ok{color:var(--ok)} .mk.bad{color:var(--bad)} .mk.pend{color:var(--dim)}
.opt.sel{border-color:var(--accent);background:rgba(124,92,255,.16)}
.opt:disabled{opacity:.85}
.qblock .opt{padding:12px 14px;font-size:15px;border-radius:12px;margin-bottom:7px;width:100%;display:block}
.gapline{font-size:16px;line-height:2.1}
.gapin{background:var(--card2);border:1.5px solid var(--accent);border-radius:9px;color:var(--txt);
  font:inherit;padding:5px 9px;min-width:110px;outline:none}
.gapin:disabled{border-color:var(--line)}
.wrin{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  color:var(--txt);font:inherit;padding:11px;outline:none;resize:vertical;line-height:1.6}
.wrin:focus{border-color:var(--accent)}
.scorecard{background:linear-gradient(150deg,#2a1f52,#1c1c27);border:1px solid var(--line);
  border-radius:18px;padding:18px;text-align:center;margin-bottom:16px}
.scorecard .sbig{font-size:32px;font-weight:800}
.scorecard .ssub{font-size:13px;color:var(--ok);font-weight:700;margin-top:2px}
.scorecard .ssub2{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:99}
.hidden{display:none!important}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div id="app"></div>

<script>
/* ============================================================
   BAŞLANGIÇ KELİME LİSTESİ  (teacher: you can edit here too)
   Format: w=English, tr=Türkçe, ex=cümle (___ = boşluk), exTr=çeviri
   ============================================================ */
const SEED = [
["kapalı","closed","Market bugün ___.","The shop is closed today."],
["başörtüsü","headscarf","___ takıyor.","She wears a headscarf."],
["örtmek","to cover","Yemeği ___ gerek.","It is necessary to cover the food."],
["örtü","cover, cloth","Masanın üstünde beyaz bir ___ var.","There is a white cloth on the table."],
["tatil","holiday","Yarın ___ başlıyor.","The holiday starts tomorrow."],
["geç kalmak","to be late","Toplantıya ___ istemiyorum.","I do not want to be late for the meeting."],
["şirket","company","Yeni bir ___ kurdu.","He founded a new company."],
["mesai","working hours, shift","___ saat altıda bitiyor.","The shift ends at six."],
["sürekli","constantly, all the time","___ aynı şeyi söylüyorsun.","You keep saying the same thing."],
["diğeri","the other one","Bu olmadı, ___ daha iyi.","This one did not work, the other is better."],
["farklı","different","Bu ikisi çok ___.","These two are very different."],
["ilaç yazmak","to prescribe medicine","Doktor bana ___ zorunda kaldı.","The doctor had to prescribe me medicine."],
["iyileşmek","to recover, to get better","Bir hafta içinde ___ istiyorum.","I want to get better within a week."],
["boyunca","throughout, during","Gece ___ yağmur yağacak.","It will rain throughout the night."],
["kendi","self, own","___ odam var.","I have my own room."],
["döviz","foreign currency","Havaalanında ___ bozdurdum.","I exchanged foreign currency at the airport."],
["bozmak","to break, to stop something working","Telefonu ___ istemedim.","I did not mean to break the phone."],
["resmi","formal, official","Bu çok ___ bir toplantı.","This is a very formal meeting."],
["birim","unit","Her ___ ayrı çalışıyor.","Each unit works separately."],
["miktar","quantity, amount","Az bir ___ yeterli.","A small amount is enough."],
["sıra","queue, line; turn","Uzun bir ___ vardı.","There was a long queue."],
["merdiven","stairs","___ çok dik.","The stairs are very steep."],
["karşı taraf","the opposite side","___ çok kalabalık.","The opposite side is very crowded."],
["yeraltı","underground","Burada büyük bir ___ şehri var.","There is a big underground city here."],
["geçit","passage, crossing","Bu ___ çok dar.","This passage is very narrow."],
["ev sahibi","landlord","___ kirayı artırdı.","The landlord raised the rent."],
["ev sahipliği yapmak","to host","Toplantıya ___ istiyoruz.","We want to host the meeting."],
["tasarruf etmek","to save (money, energy)","Biraz para ___ gerekiyor.","It is necessary to save some money."],
["yüzde elli","fifty percent","İndirim ___ oldu.","The discount was fifty percent."],
["kadar","until, as far as (+e)","Sabaha ___ çalıştım.","I worked until morning."],
["önce","before (+den)","Yemekten ___ ellerini yıka.","Wash your hands before the meal."],
["sonra","after (+den)","İşten ___ buluşalım.","Let us meet after work."],
["güvenmek","to trust (+e)","Sana ___ istiyorum.","I want to trust you."],
["hoşlanmak","to like (+den)","Bu müzikten ___ zor.","It is hard to like this music."],
["korkmak","to be afraid of (+den)","Karanlıktan ___ normal.","It is normal to be afraid of the dark."],
["alışmak","to get used to (+e)","Yeni şehre ___ zaman aldı.","It took time to get used to the new city."],
["karar vermek","to decide (+e)","Nereye gideceğimize ___ lazım.","We need to decide where to go."],
["başlamak","to start (+e)","İşe ___ üzereyim.","I am about to start work."],
["vazgeçmek","to give up (+den)","Bu fikirden ___ istemiyorum.","I do not want to give up on this idea."],
["katılmak","to join, to agree with (+e)","Bu fikre ___ zorunda değilsin.","You do not have to agree with this idea."]
];

/* ============================ CORE ============================ */
const KEY='turkce_v1';
const GOAL=12;                     // günlük hedef kart sayısı
const INTERVALS=[0,1,2,4,8,16,32]; // kutu -> kaç gün sonra

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayNum=()=>Math.floor(new Date().setHours(0,0,0,0)/864e5);

let S={words:{},deck:[],streak:0,lastDay:null,xp:0,doneDate:null,doneCount:0,best:0};

function load(){
  try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
  if(!S.deck||!S.deck.length) S.deck=SEED.map(a=>({w:a[0],tr:a[1],ex:a[2]||'',exTr:a[3]||''}));
  S.deck.forEach(w=>{ if(!S.words[w.w]) S.words[w.w]={box:0,due:0,seen:0,wrong:0}; });
  if(S.doneDate!==today()){S.doneCount=0;S.doneDate=today();}
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function bumpStreak(){
  const t=today(); if(S.lastDay===t) return;
  const y=new Date(Date.now()-864e5); const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  S.streak = (S.lastDay===ys) ? S.streak+1 : 1;
  S.lastDay=t; if(S.streak>S.best)S.best=S.streak; save();
}

function dueList(){
  const d=dayNum();
  const rev=S.deck.filter(w=>S.words[w.w].seen>0 && S.words[w.w].due<=d);
  const neu=S.deck.filter(w=>S.words[w.w].seen===0);
  rev.sort((a,b)=>S.words[a.w].box-S.words[b.w].box);
  return {rev,neu};
}
function buildSession(){
  const {rev,neu}=dueList();
  let out=rev.slice(0,GOAL);
  let i=0; while(out.length<GOAL && i<neu.length) out.push(neu[i++]);
  return shuffle(out);
}
function grade(w,ok){
  const s=S.words[w.w]; s.seen++;
  if(ok){ s.box=Math.min(s.box+1,INTERVALS.length-1); S.xp+=10; }
  else  { s.box=Math.max(1,s.box-2); s.wrong++; S.xp+=3; }
  s.due=dayNum()+INTERVALS[s.box];
  save();
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fold=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/i̇/g,'i');
const norm=s=>fold(s).trim().replace(/[.,!?;:"']/g,'').replace(/\s+/g,' ');
function lev(a,b){const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)
    m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
  return m[b.length][a.length];}
function checkTyped(user,target){
  const u=norm(user),t=norm(target);
  if(!u) return 'no';
  if(u===t) return 'yes';
  if(lev(u,t)<=(t.length>6?2:1)) return 'close';
  return 'no';
}

/* speech */
let VOICE=null;
function pickVoice(){const v=speechSynthesis.getVoices()||[];
  VOICE=v.find(x=>/^tr/i.test(x.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){ if(!('speechSynthesis'in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.85;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}catch(e){} }

/* sound + confetti */
let AC=null;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.frequency.value=ok?880:200;o.type='sine';g.gain.setValueAtTime(.12,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.25);
  if(ok){const o2=AC.createOscillator(),g2=AC.createGain();o2.connect(g2);g2.connect(AC.destination);
    o2.frequency.setValueAtTime(1320,AC.currentTime+.09);o2.type='sine';
    g2.gain.setValueAtTime(.1,AC.currentTime+.09);g2.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.32);
    o2.start(AC.currentTime+.09);o2.stop(AC.currentTime+.32);}
}catch(e){}}
function confetti(){
  const c=document.getElementById('cf'),x=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;
  const cols=['#7c5cff','#a78bfa','#34d399','#fbbf24','#fb7185','#60a5fa'];
  const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*innerHeight*.5,
    r:4+Math.random()*6,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,a:Math.random()*6,
    va:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function step(){f++;x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});
    if(f<170)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();
}

/* ============================ VIEWS ============================ */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function learnedCount(){return S.deck.filter(w=>S.words[w.w].box>=4).length}
function learningCount(){return S.deck.filter(w=>S.words[w.w].seen>0&&S.words[w.w].box<4).length}

function home(){
  const {rev,neu}=dueList();
  const pend=Math.min(GOAL,rev.length+neu.length);
  const pct=Math.min(1,S.doneCount/GOAL);
  const C=2*Math.PI*62;
  const level=Math.floor(S.xp/300)+1;
  app.innerHTML=`
  <div class="topbar">
    <div class="brand">🧠 Türkçe Antrenörü</div>
    <button class="iconbtn" onclick="view('list')">📚</button>
  </div>
  <div class="hero">
    <div class="streak">🔥 ${S.streak} günlük seri</div>
    <div class="ring">
      <svg width="150" height="150">
        <circle cx="75" cy="75" r="62" stroke="#2c2c40" stroke-width="13" fill="none"/>
        <circle cx="75" cy="75" r="62" stroke="url(#g)" stroke-width="13" fill="none"

/* ---------- SESSION ---------- */
let Q=[],qi=0,answered=false,cur=null,mode='';

function startSession(){
  Q=buildSession();
  if(!Q.length){alert('Şu an tekrar edilecek kelime yok. Yarın tekrar gel! 🎉');return;}
  Q=Q.map(w=>({w,intro:S.words[w.w].seen===0}));
  qi=0;bumpStreak();nextQ();
}
function nextQ(){
  if(qi>=Q.length){return finish();}
  cur=Q[qi];answered=false;
  if(cur.intro){cur.intro=false;return renderIntro();}
  const box=S.words[cur.w.w].box, hasEx=!!cur.w.ex;
  const pool=['mc'];
  if(hasEx)pool.push('cloze_mc');
  if(box>=2){pool.push('type');if(hasEx)pool.push('cloze_type');}
  if(box>=1)pool.push('listen');
  mode=pool[Math.random()*pool.length|0];
  render();
}
function head(){
  const p=Math.round(qi/Q.length*100);
  return `<div class="sesstop"><button class="x" onclick="quit()">✕</button>
    <div style="flex:1"><div class="pbar"><i style="width:${p}%"></i></div></div>
    <div class="muted" style="font-size:13px;font-weight:700">${qi+1}/${Q.length}</div></div>`;
}
function clozeHTML(w,fill){
  const parts=(w.ex||'').split('___');
  const b=fill?`<span class="blank filled">${esc(w.w)}</span>`:`<span class="blank">&nbsp;</span>`;
  return esc(parts[0]||'')+b+esc(parts[1]||'');
}
function distract(w,field){
  const others=shuffle(S.deck.filter(x=>x.w!==w.w)).slice(0,3);
  return shuffle([w[field],...others.map(o=>o[field])]);
}

function renderIntro(){
  const w=cur.w;
  app.innerHTML=head()+`
  <div class="card pop center">
    <div class="newtag">YENİ KELİME</div>
    <div class="word">${esc(w.w)}</div>
    <div class="tr" style="margin-top:10px">${esc(w.tr)}</div>
    <button class="spk" onclick="say('${esc(w.w).replace(/'/g,"\\'")}')">🔊 Dinle</button>
    ${w.ex?`<div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--line)">
      <div class="sent">${esc(w.ex.replace('___',w.w))}</div>
      <div class="sentTr">${esc(w.exTr||'')}</div>
      <button class="spk" onclick="say('${esc(w.ex.replace('___',w.w)).replace(/'/g,"\\'")}')">🔊 Cümleyi dinle</button>
    </div>`:''}
  </div>
  <button class="btn" onclick="nextQ()">Anladım, devam →</button>`;
}

function render(){
  const w=cur.w;
  let body='';
  if(mode==='mc'){
    const opts=distract(w,'tr');
    body=`<div class="card center"><div class="qlabel">İngilizcesi ne?</div>
      <div class="word">${esc(w.w)}</div>
      <button class="spk" onclick="say('${esc(w.w).replace(/'/g,"\\'")}')">🔊</button></div>
      <div class="opts">${opts.map(o=>`<button class="opt" onclick="pick(this,${o===w.tr})">${esc(o)}</button>`).join('')}</div>`;
  }
  else if(mode==='cloze_mc'){
    const opts=distract(w,'w');
    body=`<div class="card"><div class="qlabel">Boşluğa hangisi gelir?</div>
      <div class="sent">${clozeHTML(w,false)}</div>
      <div class="sentTr">${esc(w.exTr||'')}</div></div>
      <div class="opts">${opts.map(o=>`<button class="opt" onclick="pick(this,${o===w.w})">${esc(o)}</button>`).join('')}</div>`;
  }
  else if(mode==='type'){
    body=`<div class="card center"><div class="qlabel">Türkçesini yaz</div>
      <div class="tr" style="font-size:30px">${esc(w.tr)}</div></div>
      <input class="ans" id="in" autocomplete="off" autocorrect="off" autocapitalize="none"
        spellcheck="false" placeholder="türkçe yaz...">
      <div style="height:12px"></div>
      <button class="btn" id="go" onclick="submitTyped()">Kontrol et</button>`;
  }
  else if(mode==='cloze_type'){
    body=`<div class="card"><div class="qlabel">Boşluğu doldur</div>
      <div class="sent">${clozeHTML(w,false)}</div>
      <div class="sentTr">${esc(w.exTr||'')}</div></div>
      <input class="ans" id="in" autocomplete="off" autocorrect="off" autocapitalize="none"
        spellcheck="false" placeholder="kelimeyi yaz...">
      <div style="height:12px"></div>
      <button class="btn" id="go" onclick="submitTyped()">Kontrol et</button>`;
  }
  else if(mode==='listen'){
    body=`<div class="card center"><div class="qlabel">Dinle ve yaz</div>
      <div style="font-size:52px;margin:6px 0 4px">🎧</div>
      <button class="spk" onclick="say('${esc(w.w).replace(/'/g,"\\'")}')" style="margin-top:6px">🔊 Tekrar dinle</button></div>
      <input class="ans" id="in" autocomplete="off" autocorrect="off" autocapitalize="none"
        spellcheck="false" placeholder="duyduğunu yaz...">
      <div style="height:12px"></div>
      <button class="btn" id="go" onclick="submitTyped()">Kontrol et</button>`;
  }
  app.innerHTML=head()+body+`<div id="fb"></div>`;
  if(mode==='listen') setTimeout(()=>say(w.w),350);
  const inp=document.getElementById('in');
  if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();
    answered?nextQ():submitTyped();}});}
}

function pick(el,ok){
  if(answered)return; answered=true;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>{if(b!==el)b.classList.add('dim')});
  el.classList.add(ok?'ok':'bad');
  if(!ok){el.classList.add('shake');
    const right=mode==='cloze_mc'?cur.w.w:cur.w.tr;
    btns.forEach(b=>{if(b.textContent.trim()===right){b.classList.remove('dim');b.classList.add('ok')}});}
  beep(ok); grade(cur.w,ok); after(ok);
}
function submitTyped(){
  if(answered){return nextQ();}
  const inp=document.getElementById('in'); if(!inp)return;
  const r=checkTyped(inp.value,cur.w.w);
  if(r==='no'&&!inp.value.trim()){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),350);return;}
  answered=true;
  const ok=(r!=='no');
  inp.style.borderColor=ok?'var(--ok)':'var(--bad)';
  inp.style.color=ok?'var(--ok)':'var(--bad)';
  inp.blur(); beep(ok); grade(cur.w,r==='yes'); after(ok,r==='close');
  document.getElementById('go').textContent='Devam →';
  document.getElementById('go').onclick=nextQ;
}
function after(ok,close){
  const w=cur.w;
  const sentence=w.ex?`<div style="margin-top:10px;font-size:14px;color:var(--dim);font-style:italic">
    ${esc(w.ex.replace('___','<b style="color:var(--txt);font-style:normal">'+w.w+'</b>')).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')}</div>`:'';
  const box=document.getElementById('fb')||app;
  const html=`<div class="feed ${ok?'ok':'bad'} pop">
    ${ok?(close?'Neredeyse! Yazımına dikkat:':'Doğru! 🎉'):'Olmadı, tekrar bakalım:'}
    <b>${esc(w.w)} = ${esc(w.tr)}</b>${sentence}
    <button class="spk" onclick="say('${esc(w.ex?w.ex.replace('___',w.w):w.w).replace(/'/g,"\\'")}')">🔊 Dinle</button>
  </div>`;
  if(document.getElementById('fb')) document.getElementById('fb').innerHTML=html;
  if(!ok) Q.push({w:w,intro:false});          // yanlışsa tur sonunda tekrar sor
  S.doneCount++; save();
  if(mode==='mc'||mode==='cloze_mc'){
    const b=document.createElement('button');b.className='btn';b.style.marginTop='14px';
    b.textContent='Devam →';b.onclick=nextQ;document.getElementById('fb').appendChild(b);
  }
  qi++;
}
function quit(){ if(confirm('Turu bitirmek istiyor musun?')) home(); }

function finish(){
  syncPush();
  const done=Q.length;
  const hit=S.doneCount>=GOAL;
  if(hit)confetti();
  app.innerHTML=`<div style="height:26px"></div>
  <div class="hero pop">

    <h2 style="margin:10px 0 6px;font-size:26px">${hit?'Hedefi tuttun!':'Güzel iş!'}</h2>

function b64e(o,pfx){return (pfx||'SOZCUK1')+'-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function b64d(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim().replace(/\s+/g,'').replace(/^[A-Z]+\d*-/,'')))))}

/* ---- yedekleme / ilerleme kodu ---- */
function backupObj(){return{v:1,words:S.words,deck:S.deck,streak:S.streak,best:S.best,
  xp:S.xp,lastDay:S.lastDay,at:today()}}
function makeBackup(){

  o.value=b64e(backupObj(),'YEDEK1'); o.classList.remove('hidden');

}
function copyEl(id,btnId,label){
  const o=document.getElementById(id); o.select(); o.setSelectionRange(0,99999);
  try{document.execCommand('copy');navigator.clipboard&&navigator.clipboard.writeText(o.value);}catch(e){}
  const b=document.getElementById(btnId); b.textContent='✓ Kopyalandı';
  setTimeout(()=>b.textContent=label,1600);
}
function restoreBackup(){
  const v=document.getElementById('bin').value.trim(); if(!v)return;
  let d; try{d=b64d(v)}catch(e){alert('Yedek kodu okunamadı. Kodun tamamını yapıştır.');return;}
  if(!d||!d.words||!d.deck){alert('Bu bir yedek kodu değil.');return;}
  if(!confirm('Bu yedek şu anki ilerlemenin yerine geçecek. Devam edilsin mi?'))return;
  S.words=d.words;S.deck=d.deck;S.streak=d.streak||0;S.best=d.best||0;
  S.xp=d.xp||0;S.lastDay=d.lastDay||null;
  S.deck.forEach(w=>{if(!S.words[w.w])S.words[w.w]={box:0,due:0,seen:0,wrong:0}});
  save(); alert('Yedek geri yüklendi ✅  '+S.deck.length+' kelime, 🔥 '+S.streak+' günlük seri');
  home();
}

function analyzeStudent(){
  const v=document.getElementById('ain').value.trim(); if(!v)return;
  let d; try{d=b64d(v)}catch(e){alert('Kod okunamadı.');return;}
  if(!d||!d.words||!d.deck){alert('Bu bir ilerleme kodu değil.');return;}
  const rows=d.deck.map(w=>{const s=d.words[w.w]||{box:0,seen:0,wrong:0};
    return{w:w.w,tr:w.tr,box:s.box||0,seen:s.seen||0,wrong:s.wrong||0}});
  const learned=rows.filter(r=>r.box>=4).length;
  const learning=rows.filter(r=>r.seen>0&&r.box<4).length;
  const untouched=rows.filter(r=>r.seen===0).length;
  const weak=rows.filter(r=>r.seen>0).sort((a,b)=>a.box-b.box||b.wrong-a.wrong).slice(0,15);
  document.getElementById('aout').innerHTML=`
    <div class="stats"><div class="stat"><b>${learned}</b><span>öğrenildi</span></div>
    <div class="stat"><b>${learning}</b><span>öğreniliyor</span></div>
    <div class="stat"><b>${untouched}</b><span>hiç görmedi</span></div></div>
    <div class="note">🔥 ${d.streak||0} günlük seri · ${d.xp||0} XP · son çalışma: ${esc(d.lastDay||'—')} · yedek tarihi: ${esc(d.at||'—')}</div>
    <div class="sec-title">Derste tekrar edilecekler</div>
    ${weak.length?weak.map(r=>`<div class="witem"><div><div class="w">${esc(r.w)}</div>
      <div class="t">${esc(r.tr)} · ${r.wrong} hata / ${r.seen} deneme</div></div>
      <div class="dots">${[1,2,3,4,5].map(i=>`<div class="dot ${r.box>=i?'on':''}"></div>`).join('')}</div></div>`).join('')
      :'<div class="note">Henüz çalışılmış kelime yok.</div>'}`;
}

function parseLines(txt){
  return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length<2)return null;
    let ex=p[2]||'';
    if(ex && ex.indexOf('___')===-1){
      const re=new RegExp('\\b'+p[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      ex=re.test(ex)?ex.replace(re,'___'):ex;
    }
    return {w:p[0],tr:p[1],ex:ex,exTr:p[3]||''};
  }).filter(Boolean);
}
function makeCode(){
  const list=parseLines(document.getElementById('tin').value);
  if(!list.length){alert('En az bir satır gir: kelime | türkçe | örnek cümle');return;}
  const code=b64e(list);
  const o=document.getElementById('tout');
  o.value=code; o.classList.remove('hidden');
  document.getElementById('tcopy').classList.remove('hidden');
  document.getElementById('tinfo').textContent=list.length+' kelime hazır. Kodu kopyalayıp öğrencine gönder.';
}
function copyCode(){ copyEl('tout','tcopy','📋 Kodu kopyala'); }
function applyCode(){
  const v=document.getElementById('sin').value.trim();
  if(!v)return;
  let list; try{list=b64d(v)}catch(e){alert('Kod okunamadı. Kodun tamamını yapıştırdığından emin ol.');return;}
  if(!Array.isArray(list)){alert('Kod geçersiz.');return;}
  let added=0;
  list.forEach(n=>{
    const ex=S.deck.find(d=>d.w.toLowerCase()===String(n.w).toLowerCase());
    if(ex){ex.tr=n.tr||ex.tr;ex.ex=n.ex||ex.ex;ex.exTr=n.exTr||ex.exTr;}
    else{S.deck.push({w:n.w,tr:n.tr||'',ex:n.ex||'',exTr:n.exTr||''});
         S.words[n.w]={box:0,due:0,seen:0,wrong:0};added++;}
  });
  save(); alert(added+' yeni kelime eklendi! 🎉 Toplam: '+S.deck.length);
  home();
}

  allDone:'\u2705 Hepsi tamam. \u00d6\u011fretmenin yeni not g\u00f6nderince burada olacak.',
  empty:'Hen\u00fcz not yok. \u00d6\u011fretmenin dersten sonra g\u00f6nderecek.',

/* ---------------- grammar notes ---------------- */
const NOTE_INTERVALS=[0,1,3,7,16,30];
function noteState(id){
  if(!S.noteState) S.noteState={};
  if(!S.noteState[id]) S.noteState[id]={box:0,due:0,seen:0};
  return S.noteState[id];
}
function notesDue(){
  if(!S.notes||!S.notes.length) return [];
  const d=dayNum();
  return S.notes.filter(function(n){ return noteState(n.id).due<=d; });
}
function notesView(){
  const all=S.notes||[], due=notesDue().length, d=dayNum();
  app.innerHTML=`<div class="topbar"><button class="iconbtn" onclick="home()">←</button>
    <div class="brand" style="font-size:17px">${NT.title} (${all.length})</div>
    <button class="iconbtn" onclick="view('settings')">⚙️</button></div>
    ${all.length ? (due
        ? `<button class="btn" onclick="startNoteReview()">${NT.reviewBtn(due)}</button><div style="height:16px"></div>`
        : `<div class="hint" style="margin-top:0;margin-bottom:16px">${NT.allDone}</div>`)
      : ''}
    ${all.length ? all.map(function(n){
        const st=noteState(n.id), isDue=st.due<=d;
        return `<div class="noteitem"${isDue?'':' style="opacity:.7"'}><b>${NT.label}${isDue?' · '+NT.dueTag:''}</b>${esc(n.text)}</div>`;
      }).join('') : `<div class="hint">${NT.empty}</div>`}`;
}
let NQ=[], nqi=0;
function startNoteReview(){
  NQ=notesDue(); if(!NQ.length) NQ=(S.notes||[]).slice();
  if(!NQ.length) return notesView();
  nqi=0; renderNote();
}
function renderNote(){
  if(nqi>=NQ.length){ save(); syncPush(); return notesView(); }
  const n=NQ[nqi], p=Math.round(nqi/NQ.length*100);
  app.innerHTML=`<div class="sesstop"><button class="x" onclick="notesView()">✕</button>
    <div style="flex:1"><div class="pbar"><i style="width:${p}%"></i></div></div>
    <div class="muted" style="font-size:13px;font-weight:700">${nqi+1}/${NQ.length}</div></div>
    <div class="noteitem pop" style="font-size:15px"><b>${NT.label}</b>${esc(n.text)}</div>
    <div style="height:18px"></div>
    <button class="btn" onclick="rateNote(true)">${NT.gotIt}</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="rateNote(false)">${NT.again}</button>`;
}
function rateNote(ok){
  const st=noteState(NQ[nqi].id); st.seen++;
  if(ok){ st.box=Math.min(st.box+1,NOTE_INTERVALS.length-1); S.xp+=5; }
  else   { st.box=Math.max(0,st.box-1); }
  st.due=dayNum()+NOTE_INTERVALS[st.box];
  save(); nqi++; renderNote();
}

  dueIn:function(d){return d+' g\u00fcn kald\u0131';},
  submit:'G\u00f6nder', submitted:'G\u00f6nderildi',
  heldBack:'\u00d6\u011fretmenin cevaplar\u0131 derste seninle birlikte inceleyecek.',
  autosave:'Cevaplar\u0131n yazd\u0131k\u00e7a kaydedilir \u2014 sonra devam edebilirsin.',

/* ================= assignments: shared parser + scoring ================= */
/* Markup:
     TEXT ... END          reading passage
     Q question            multiple choice; options on following lines
       - wrong             (- wrong, * correct)
       * right
     GAP sentence with ___ | answer            typed answer, / separates alternatives
     WRITE prompt                              free writing, not auto-scored
   Blank lines are ignored outside TEXT blocks.                                */

function parseTask(body){
  const lines = String(body||'').replace(/\r/g,'').split('\n');
  const items = [];
  let i = 0, n = 0;
  while(i < lines.length){
    const raw = lines[i], line = raw.trim();

    if(/^TEXT\b/i.test(line)){
      const buf = [];
      i++;
      while(i < lines.length && !/^END\b/i.test(lines[i].trim())){ buf.push(lines[i]); i++; }
      i++;
      items.push({ kind:'text', body: buf.join('\n').trim() });
      continue;
    }

    if(/^Q\s+/i.test(line)){
      const q = { kind:'mc', id:'q'+(++n), q: line.replace(/^Q\s+/i,'').trim(), opts:[], answer:-1 };
      i++;
      while(i < lines.length){
        const o = lines[i].trim();
        if(/^[-*]\s+/.test(o)){
          if(o.charAt(0) === '*') q.answer = q.opts.length;
          q.opts.push(o.replace(/^[-*]\s+/,'').trim());
          i++;
        } else break;
      }
      items.push(q);
      continue;
    }

    if(/^GAP\s+/i.test(line)){
      const rest = line.replace(/^GAP\s+/i,'');
      const bar = rest.lastIndexOf('|');
      const sentence = (bar > -1 ? rest.slice(0,bar) : rest).trim();
      const answers = (bar > -1 ? rest.slice(bar+1) : '').split('/').map(s=>s.trim()).filter(Boolean);
      items.push({ kind:'gap', id:'q'+(++n), q: sentence, answers: answers });
      i++;
      continue;
    }

    if(/^WRITE\s+/i.test(line)){
      items.push({ kind:'write', id:'q'+(++n), q: line.replace(/^WRITE\s+/i,'').trim() });
      i++;
      continue;
    }

    i++;
  }
  return items;
}

function taskQuestions(items){
  return items.filter(function(it){ return it.kind !== 'text'; });
}
function taskAutoMax(items){
  return items.filter(function(it){ return it.kind === 'mc' || it.kind === 'gap'; }).length;
}

/* Grades one answer. Returns true / false / null (null = needs a human). */
function gradeItem(it, ans){
  if(it.kind === 'mc'){
    if(ans === undefined || ans === null || ans === '') return false;
    return Number(ans) === Number(it.answer);
  }
  if(it.kind === 'gap'){
    if(!ans) return false;
    if(!it.answers || !it.answers.length) return null;
    return it.answers.some(function(a){ return checkTyped(ans, a) !== 'no'; });
  }
  return null;
}

function scoreTask(items, answers){
  let score = 0, max = 0;
  taskQuestions(items).forEach(function(it){
    const g = gradeItem(it, answers ? answers[it.id] : undefined);
    if(g === null) return;
    max++;
    if(g) score++;
  });
  return { score: score, max: max };
}

/* ---- task state helpers (student side) ---- */
function taskState(id){
  if(!S.tasks) S.tasks = {};
  if(!S.tasks[id]) S.tasks[id] = { answers:{}, submittedAt:null, score:0, max:0 };
  return S.tasks[id];
}
function taskList(){ return (S.taskDefs || []); }
function tasksOpen(){
  return taskList().filter(function(t){ return !taskState(t.id).submittedAt; });
}
function dueYMD(due){
  if(!due) return null;
  const s = String(due);
  const plain = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(plain) return [ +plain[1], +plain[2]-1, +plain[3] ];
  const d = new Date(s);
  if(isNaN(d.getTime())) return null;
  return [ d.getFullYear(), d.getMonth(), d.getDate() ];
}
function dueLabel(due){
  const p = dueYMD(due);
  if(!p) return '';
  return p[0]+'-'+String(p[1]+1).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0');
}
function dueInDays(due){
  const p = dueYMD(due);
  if(!p) return null;
  return Math.round((new Date(p[0],p[1],p[2]).getTime() - new Date().setHours(0,0,0,0)) / 864e5);
}

/* ================= assignments: student UI ================= */

function tasksView(){
  const all = taskList();
  app.innerHTML = `<div class="topbar"><button class="iconbtn" onclick="home()">←</button>
    <div class="brand" style="font-size:17px">${TS.title}</div>
    <button class="iconbtn" onclick="view('settings')">⚙️</button></div>
    ${all.length ? all.map(function(t){
      const st = taskState(t.id), items = parseTask(t.body), qn = taskQuestions(items).length;
      const d = dueInDays(t.due);
      let status, cls;
      if(st.submittedAt){ status = TS.done(st.score, st.max); cls = 'ok'; }
      else if(Object.keys(st.answers||{}).length){ status = TS.started; cls = 'mid'; }
      else { status = TS.notStarted; cls = ''; }
      const dueTxt = t.due ? (d===null ? '' : (d < 0 ? TS.overdue : d === 0 ? TS.dueToday : d === 1 ? TS.dueTomorrow : TS.dueIn(d))) : '';
      return `<div class="taskcard ${cls}" onclick="openTask('${t.id}')">
        <div class="tt">${esc(t.title || TS.untitled)}</div>
        <div class="ts">${qn} ${TS.questions}${dueTxt ? ' · ' + dueTxt : ''}</div>
        <div class="tstatus ${cls}">${status}</div>
      </div>`;
    }).join('') : `<div class="hint">${TS.empty}</div>`}`;
}

let curTask = null;

function openTask(id){
  const t = taskList().filter(function(x){ return x.id === id; })[0];
  if(!t) return tasksView();
  curTask = t;
  renderTask();
}

function renderTask(){
  const t = curTask, st = taskState(t.id), items = parseTask(t.body);
  const done = !!st.submittedAt;
  let qi = 0;

  const blocks = items.map(function(it){
    if(it.kind === 'text'){
      return `<div class="passage">${esc(it.body)}</div>`;
    }
    qi++;
    const a = st.answers ? st.answers[it.id] : undefined;
    const g = done ? gradeItem(it, a) : undefined;
    const mark = !done ? '' : (g === true ? '<span class="mk ok">✓</span>' : g === false ? '<span class="mk bad">✕</span>' : '<span class="mk pend">•</span>');

    if(it.kind === 'mc'){
      return `<div class="qblock${done && g===false ? ' wrong' : ''}">
        <div class="qh">${qi}. ${esc(it.q)} ${mark}</div>
        ${it.opts.map(function(o,ix){
          const sel = String(a) === String(ix);
          return `<button class="opt${sel?' sel':''}" ${done?'disabled':''} onclick="answer('${it.id}',${ix})">${esc(o)}</button>`;
        }).join('')}
      </div>`;
    }
    if(it.kind === 'gap'){
      const parts = String(it.q).split('___');
      return `<div class="qblock${done && g===false ? ' wrong' : ''}">
        <div class="qh">${qi}. ${mark}</div>
        <div class="gapline">${esc(parts[0]||'')}
          <input class="gapin" ${done?'disabled':''} value="${esc(a||'')}"
            oninput="answer('${it.id}', this.value)" autocomplete="off" autocorrect="off"
            autocapitalize="none" spellcheck="false">${esc(parts.slice(1).join('___'))}</div>
      </div>`;
    }
    return `<div class="qblock">
      <div class="qh">${qi}. ${esc(it.q)} ${done?'<span class="mk pend">•</span>':''}</div>
      <textarea class="wrin" ${done?'disabled':''} oninput="answer('${it.id}', this.value)"
        placeholder="${TS.writeHere}">${esc(a||'')}</textarea>
    </div>`;
  }).join('');

  const auto = taskAutoMax(items);
  app.innerHTML = `<div class="topbar"><button class="iconbtn" onclick="tasksView()">←</button>
    <div class="brand" style="font-size:16px">${esc(t.title || TS.untitled)}</div>
    <div style="width:40px"></div></div>
    ${done ? `<div class="scorecard">
        <div class="sbig">${st.score} / ${st.max}</div>
        <div class="ssub">${TS.submitted}</div>
        <div class="ssub2">${TS.heldBack}</div>
      </div>` : ''}
    ${blocks}
    ${done ? '' : `<div style="height:8px"></div>
      <button class="btn" onclick="submitTask()">${TS.submit}</button>
      <div class="hint" style="margin-top:10px">${TS.autosave}${auto ? ' ' + TS.autoNote(auto) : ''}</div>`}`;
}

function answer(qid, val){
  const st = taskState(curTask.id);
  if(st.submittedAt) return;
  if(!st.answers) st.answers = {};
  st.answers[qid] = val;
  save();
  if(typeof val === 'number') renderTask();
}

function submitTask(){
  const t = curTask, st = taskState(t.id), items = parseTask(t.body);
  const qs = taskQuestions(items);
  const blank = qs.filter(function(it){
    const a = st.answers ? st.answers[it.id] : undefined;
    return a === undefined || a === null || String(a).trim() === '';
  }).length;
  if(blank && !confirm(TS.confirmBlank(blank))) return;
  const r = scoreTask(items, st.answers);
  st.score = r.score; st.max = r.max;
  st.submittedAt = new Date().toISOString();
  S.xp += 20;
  save();
  syncPush();
  renderTask();
}

/* ---------------- teacher sync ---------------- */
const SYNC_API='https://script.google.com/macros/s/AKfycbzqihr2OdBdbFS4eRVl0dhsO-9Mo7UCjFnEFuT-rei-X3ViFmr42rJ2c9iQ5jMLGmYkMw/exec';
const SYNC_STUDENT_DEFAULT='arseniy';
const SYNC_SLOT='sync_student_'+SYNC_STUDENT_DEFAULT;
function syncCfg(){
  try{
    const h=location.hash||'';
    if(h.indexOf('k=')>-1){
      const p=new URLSearchParams(h.replace(/^#/,''));
      if(p.get('k')) localStorage.setItem('sync_key',p.get('k'));
      localStorage.setItem(SYNC_SLOT, p.get('s')||SYNC_STUDENT_DEFAULT);
      history.replaceState(null,'',location.pathname);
    }
  }catch(e){}
  return {key:localStorage.getItem('sync_key'),
          student:localStorage.getItem(SYNC_SLOT)||SYNC_STUDENT_DEFAULT};
}
let NEW_TASKS=0;
async function syncPull(){
  const c=syncCfg(); if(!c.key) return 0;
  NEW_TASKS=0;
  const r=await fetch(SYNC_API+'?key='+encodeURIComponent(c.key)+'&action=pull&student='+encodeURIComponent(c.student));
  const d=await r.json(); if(!d||!d.ok) return 0;
  if(!S.notes) S.notes=[];
  let added=0, changed=false;
  (d.items||[]).forEach(function(it){
    if(it.type==='task'){
      if(!S.taskDefs) S.taskDefs=[];
      const tx=S.taskDefs.findIndex(function(x){return x.id===it.id;});
      if(it.deleted){ if(tx>-1){ S.taskDefs.splice(tx,1); changed=true; } }
      else {
        const def={id:it.id,title:it.w||'',due:it.tr||'',body:it.note||''};
        if(tx>-1){ if(JSON.stringify(S.taskDefs[tx])!==JSON.stringify(def)){ S.taskDefs[tx]=def; changed=true; } }
        else { S.taskDefs.push(def); changed=true; NEW_TASKS++; }
      }
      return;
    }
    if(it.type==='note'){
      if(it.deleted){ const b=S.notes.length; S.notes=S.notes.filter(n=>n.id!==it.id); if(S.notes.length!==b) changed=true; }
      else if(!S.notes.some(n=>n.id===it.id)){ S.notes.push({id:it.id,text:String(it.note||'')}); changed=true; }
      return;
    }
    if(!it.w) return;
    const idx=S.deck.findIndex(x=>String(x.w).toLowerCase()===String(it.w).toLowerCase());
    if(it.deleted){
      if(idx>-1){ delete S.words[S.deck[idx].w]; S.deck.splice(idx,1); changed=true; }
    } else if(idx>-1){
      const d0=S.deck[idx];
      if(it.tr&&it.tr!==d0.tr){d0.tr=it.tr;changed=true;}
      if(it.ex&&it.ex!==d0.ex){d0.ex=it.ex;changed=true;}
      if(it.exTr&&it.exTr!==d0.exTr){d0.exTr=it.exTr;changed=true;}
    } else {
      S.deck.push({w:it.w,tr:it.tr||'',ex:it.ex||'',exTr:it.exTr||''});
      S.words[it.w]={box:0,due:0,seen:0,wrong:0}; added++; changed=true;
    }
  });
  if(changed) save();
  return added;
}
function syncPush(){
  const c=syncCfg(); if(!c.key) return;
  try{
    fetch(SYNC_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:c.key,action:'push',student:c.student,
        streak:S.streak,xp:S.xp,learned:learnedCount(),deck:S.deck.length,
        progress:{words:S.words,deck:S.deck.map(function(w){return {w:w.w,tr:w.tr};}),tasks:S.tasks||{}}})}).catch(function(){});
  }catch(e){}
}
function syncToast2(t){
  const d=document.createElement('div');
  d.className='synctoast';
  d.textContent=t;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); },8000);
}
function syncToast(n){
  const d=document.createElement('div');
  d.className='synctoast';
  d.textContent='🎁 '+'Öğretmenin '+n+' yeni kelime ekledi';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); },8000);
}
async function syncNow(){
  if(!navigator.onLine) return;
  try{
    const added=await syncPull();
    if(added>0){ syncToast(added); home(); }
    if(NEW_TASKS>0){ syncToast2(TS.home); home(); }
    syncPush();
  }catch(e){}
}
const NOTES_TITLE='Öğretmeninden not';

load(); home(); syncNow();

  });
